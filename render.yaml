services:
  # Dedicated Backend REST API Service
  - type: web
    name: teentalk-backend-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: EVIDENCE_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
